services:
  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health/" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  celery_worker:
    build: ./backend
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=jobpulse
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  scraper:
    build: ./scraper
    volumes:
      - ./scraper:/app
      - scraper_session:/app/session
    env_file:
      - .env
    depends_on:
      web:
        condition: service_healthy

  bot:
    build: ./bot
    volumes:
      - ./bot:/app
    env_file:
      - .env
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6380
      - BACKEND_URL=http://localhost:8001
    network_mode: "host"
    restart: unless-stopped

volumes:
  postgres_data:
  scraper_session:
