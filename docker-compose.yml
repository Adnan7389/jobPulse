services:
  web:
    build: ./backend
    # command: python manage.py runserver 0.0.0.0:8000 # Using Dockerfile CMD (gunicorn)
    volumes:
      - ./backend:/app
      - static_volume:/app/static
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - BOT_INTERNAL_URL=http://bot:8080
    depends_on:
      - db
      - redis
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health/" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static
    depends_on:
      web:
        condition: service_healthy

  celery_worker:
    build: ./backend
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - BOT_INTERNAL_URL=http://bot:8080
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=jobpulse
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  scraper:
    build: ./scraper
    volumes:
      - ./scraper:/app
      - scraper_session:/app/session
    env_file:
      - .env
    depends_on:
      web:
        condition: service_healthy

  bot:
    build: ./bot
    volumes:
      - ./bot:/app
    # ports:
    #   - "8081:8080" # Closed for security, use internal networking
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BACKEND_URL=http://web:8000
    depends_on:
      - redis
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  scraper_session:
  static_volume:
